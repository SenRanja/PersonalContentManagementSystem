server {
    listen ${PORT} ssl;
    server_name shenyanjian.top www.shenyanjian.top;

    ssl_certificate /etc/letsencrypt/live/shenyanjian.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shenyanjian.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1g;

    location / {
        proxy_pass http://pcms:${PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}