services:
  pcms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcms
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/setup/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gateway:
    image: nginx:1.27-alpine
    container_name: pcms-gateway
    restart: unless-stopped
    depends_on:
      pcms:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx-8080.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro