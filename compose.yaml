services:
  pcms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcms
    restart: unless-stopped
    expose:
      - "${PORT:-8080}"
    environment:
      NODE_ENV: production
      PORT: "${PORT:-8080}"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/setup/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gateway:
    image: nginx:1.27-alpine
    container_name: pcms-gateway
    restart: unless-stopped
    depends_on:
      pcms:
        condition: service_healthy
    environment:
      PORT: "${PORT:-8080}"
      NGINX_ENVSUBST_FILTER: ^PORT$
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./deploy/nginx-8080.conf:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro